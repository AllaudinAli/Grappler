# ==========================================================
#  yt-dlp defaults for Grappler (app and Download.bat)
# ==========================================================
#  One option per line. Lines starting with # are ignored.
#  These apply to EVERY download. The menu adds the quality
#  choice on top, and anything it passes overrides this file.
#
#  Full list of options:  bin\yt-dlp.exe --help
# ==========================================================


# ---- FILE NAMING -----------------------------------------
# Saved relative to the download folder set in settings.ps1.
# The %(...)s parts get filled in per video - keep them.
-o "%(title)s [%(id)s].%(ext)s"

# Replace characters Windows won't allow in filenames
--windows-filenames

# Cap filename length (long titles break some programs)
--trim-filenames 150

# Don't re-download something that's already finished
--no-overwrites


# ---- RELIABILITY (this is what makes big files work) -----
# Resume a partial download instead of starting over
--continue

# Keep retrying instead of giving up on a blip
--retries 20
--fragment-retries 20
--retry-sleep 3
--file-access-retries 10

# Pull 4 chunks at once - noticeably faster on large videos
--concurrent-fragments 4

# One bad video in a playlist shouldn't kill the whole run
--no-abort-on-error

# Sites with no dedicated extractor often sit behind bot checks that
# serve a challenge page instead of the player ("Unable to extract
# flashvars"). This makes the generic extractor look like Chrome.
# Scoped to "generic", so YouTube and other supported sites are untouched.
--extractor-args "generic:impersonate=chrome"


# ---- EXTRAS BAKED INTO THE FILE --------------------------
# Title, channel, date, etc. written into the video file
--embed-metadata

# Cover/poster image
--embed-thumbnail

# Chapter markers, if the source has them
--embed-chapters

# Burn in subtitles as a selectable track
--embed-subs
--sub-langs "en.*"

# Prefer .mp4 as the container when merging video + audio
--merge-output-format mp4

# File timestamp = when you downloaded it
--no-mtime


# ---- CONSOLE OUTPUT --------------------------------------
# Show the progress bar in the terminal
--progress

# Also mirror progress into the window title bar, so you can see it
# when the window is minimised
--console-title

# Note: parallel mode (menu option M) adds --newline and a
# --progress-template of its own, so it can parse each download's
# progress and draw the dashboard. Don't add --newline here - it
# turns the single-download progress bar into a wall of scrolling
# lines instead of one line updating in place.
